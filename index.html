<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For MAMLII 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Poppins',sans-serif;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  text-align:center;
  color:white;
}

/* screens */
.screen { display:none; padding:20px; }
.active { display:block; }

/* input */
input {
  padding:10px;
  border:none;
  border-radius:20px;
  text-align:center;
  margin-top:10px;
}

/* button */
button {
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:white;
  color:#ff6f91;
  margin-top:10px;
  cursor:pointer;
}

/* cake */
.cake-img {
  width:200px;
  border-radius:15px;
  margin-top:20px;
}

/* gifts */
.gifts {
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

.gift {
  font-size:40px;
  cursor:pointer;
}

/* gallery */
.gallery {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:20px;
}

.gallery img {
  width:100%;
  border-radius:10px;
}

/* letter */
.letter {
  background:rgba(255,255,255,0.2);
  padding:15px;
  border-radius:15px;
  margin-top:20px;
  min-height:150px;
}

/* cursor */
.cursor {
  display:inline-block;
  width:2px;
  background:white;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%,50%,100% {opacity:1;}
  25%,75% {opacity:0;}
}

/* confetti */
canvas {
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>

<body>

<!-- PASSCODE -->
<div id="lock" class="screen active">
  <h2>Enter Passcode 🔐</h2>
  <p>(Hint: something special 😉)</p>
  <input type="password" id="code">
  <br>
  <button onclick="checkCode()">Unlock 💖</button>
</div>

<!-- CAKE -->
<div id="cake" class="screen">
  <h1>🎂 Happy Birthday, MAMLII 💖</h1>
  <p>Make a wish ✨</p>

  <img src="images/cake.jpg" class="cake-img">

  <br>
  <button onclick="blowCandles()">BLOW 🕯️</button>
</div>

<!-- GIFTS -->
<div id="gifts" class="screen">
  <h2>🎁 Open Your Gifts</h2>

  <div class="gifts">
    <div class="gift" onclick="openGift(1)">🎁</div>
    <div class="gift" onclick="openGift(2)">🎁</div>
    <div class="gift" onclick="openGift(3)">🎁</div>
  </div>

  <!-- Gift 1 -->
  <div id="gift1" class="screen">
    <h3>Our Goofy Moments 😂</h3>
    <div class="gallery">
      <img src="images/goofy1.jpg">
      <img src="images/goofy2.jpg">
      <img src="images/goofy3.jpg">
    </div>
  </div>

  <!-- Gift 2 -->
  <div id="gift2" class="screen">
    <h3>A Letter For You 💌</h3>
    <div class="letter">
      <span id="typeText"></span><span class="cursor"></span>
    </div>
  </div>

  <!-- Gift 3 -->
  <div id="gift3" class="screen">
    <h3>Our Memories 💕</h3>
    <div class="gallery">
      <img src="images/memory1.jpg">
      <img src="images/memory2.jpg">
      <img src="images/memory3.jpg">
      <img src="images/memory4.jpg">
      <img src="images/memory5.jpg">
    </div>
  </div>

</div>

<canvas id="confetti"></canvas>

<script>
// PASSCODE
function checkCode() {
  let code = document.getElementById("code").value;
  if(code === "0205"){
    showScreen("cake");
  } else {
    alert("Wrong code 😤 try again");
  }
}

// SCREEN SWITCH
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  if(id === "gift2") startTyping();
}

// BLOW
function blowCandles(){
  startConfetti();
  setTimeout(()=>showScreen("gifts"),2000);
}

// GIFTS
function openGift(num){
  showScreen("gift"+num);
}

// TYPEWRITER
const message = `Dear MAMLII,

You are my favorite person, my safe place, and my chaos partner 💀❤️

Thank you for every laugh, every memory, and every moment we've shared.

Life is so much better with you in it 🫶

I hope this year brings you everything you deserve ✨

Forever your bestie 💖`;

let i = 0;

function startTyping(){
  const el = document.getElementById("typeText");
  el.innerHTML = "";
  i = 0;

  function type(){
    if(i < message.length){
      el.innerHTML += message.charAt(i);
      i++;
      setTimeout(type, 40);
    }
  }
  type();
}

// CONFETTI
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confetti = [];

function startConfetti(){
  confetti=[];
  for(let i=0;i<150;i++){
    confetti.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:Math.random()*6+2,
      color:"hsl("+Math.random()*360+",100%,50%)"
    });
  }
  setInterval(draw,20);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  confetti.forEach(c=>{
    ctx.fillStyle=c.color;
    ctx.fillRect(c.x,c.y,c.r,c.r);
    c.y+=2;
    if(c.y>canvas.height)c.y=0;
  });
}
</script>

</body>
</html>
